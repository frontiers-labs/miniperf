# Coverage comes from checks/, which drives the packaged binaries on real
# recordings. See checks/lint/test-policy.
[package]
name = "libprof"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Local profiling sources: PMU counting and sampling, precise memory, host telemetry and resource monitoring"
license = "LGPL-3.0-only"
repository = "https://github.com/frontiers-labs/miniperf"
homepage = "https://github.com/frontiers-labs/miniperf"
readme = "README.md"
keywords = ["performance", "profiling", "perf", "pmu", "telemetry"]
categories = ["development-tools::profiling"]
include = ["src/**", "events/**", "examples/**", "build.rs", "README.md", "CHANGELOG.md"]

[lib]
test = false
doctest = false
name = "libprof"

[features]
default = ["events-native"]
events-native = []
events-x86-64 = []
events-aarch64 = []
events-riscv64 = []
symbolize = ["dep:symbolize"]
criterion = ["dep:criterion"]

[dependencies]
anyhow = "1.0"
cfg-if = "1.0.0"
libc = "0.2.144"
thiserror = "2.0.9"
pmu-data = { package = "miniperf-pmu-data", path = "../pmu-data/", version = "0.1.0" }
lazy_static = "1.5.0"
proc-maps = "0.4.0"
object = "0.39.1"
smallvec = "1.13.2"
itertools = "0.14.0"
uuid = { version = "1.16.0", features = ["v7"] }
hashbrown = "0.15.2"
criterion = { version = "0.5.1", optional = true, default-features = false }
symbolize = { package = "miniperf-symbolize", path = "../symbolize", version = "0.1.0", optional = true }

[dev-dependencies]
insta = "1.42.2"

[target.'cfg(any(target_arch = "aarch64", target_arch = "riscv64"))'.dependencies]
proc_getter = "0.0.3"

[target.'cfg(target_os = "macos")'.dependencies]
dlopen2 = "0.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
perf-event-open-sys2 = "5.0.6"

# Post-hoc DWARF unwinding of captured stack dumps. framehop has a native
# unwinder for these architectures only; elsewhere the kernel callchain stands
# and `PostHocUnwinder` compiles without it.
[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
framehop = { version = "0.16.0", default-features = false, features = ["std"] }
framehop-object = "0.2.0"

[build-dependencies]
serde = "1.0.217"
serde_json = "1.0.138"
pmu-data = { package = "miniperf-pmu-data", path = "../pmu-data/", version = "0.1.0" }
glob = "0.3.2"
quote = "1.0.38"
proc-macro2 = "1.0"
prettyplease = "0.2.29"
syn = "2.0.96"

[[example]]
name = "quick_sample"
required-features = ["symbolize"]

[[example]]
name = "criterion_counter"
required-features = ["criterion"]

[package.metadata.docs.rs]
features = ["symbolize", "criterion", "events-native"]
rustdoc-args = ["--cfg", "docsrs"]

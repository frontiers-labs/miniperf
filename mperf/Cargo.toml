# Coverage comes from checks/, which drives the packaged binaries on real
# recordings. See checks/lint/test-policy.
[package]
name = "mperf"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Cross-platform sampling profiler and performance analysis toolkit"
repository = "https://github.com/frontiers-labs/miniperf"
readme = "../README.md"
default-run = "mperf"

[lib]
test = false
doctest = false
name = "mperf"
path = "src/lib.rs"

[[bin]]
test = false
name = "mperf"
path = "src/bin/mperf.rs"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
comfy-table = "7.1.3"
num-format = "0.4.4"
libprof = { path = "../libprof" }
pmu-data = { package = "miniperf-pmu-data", path = "../pmu-data" }
anyhow = "1.0.95"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mperf-data = { path = "../mperf-data/" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
parking_lot = "0.12.3"
proc-maps = "0.4.0"
ratatui = {version = "0.29.0", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.13"
thread_local = "1.1.8"
libc = "0.2.169"
smallvec = "1.13.2"
shmem = { path = "../shmem/" }
miniperf-store = { path = "../store" }
uuid = { version = "1.16.0", features = ["v7"] }
kdam = "0.6.2"
flamelens = "0.3.1"
inferno = "0.12.2"
regex = "1.11.1"
rayon = "1.12.0"
which = "6.0.1"
addr2line = "0.24.2"
object = "0.39.1"
symbolize = { package = "miniperf-symbolize", path = "../symbolize" }

[build-dependencies]
cc = "1.2.54"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
framehop = { version = "0.16.0", default-features = false, features = ["std"] }
framehop-object = "0.2.0"

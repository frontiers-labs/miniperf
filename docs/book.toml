[book]
title = "miniperf user manual"
authors = ["miniperf contributors"]
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
git-repository-url = "https://github.com/frontiers-labs/miniperf"
edit-url-template = "https://github.com/frontiers-labs/miniperf/edit/master/docs/{path}"
site-url = "/miniperf/"
mathjax-support = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
limit-results = 20

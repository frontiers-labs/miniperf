# Coverage comes from checks/, which drives the packaged binaries on real
# recordings. See checks/lint/test-policy.
[package]
name = "mperf-gui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.23", features = ["derive"] }
# Compile Metal shaders through the framework at startup on macOS. This keeps
# local builds working without the optional Xcode Metal Toolchain component.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
miniperf-store = { path = "../store" }
mperf-data = { path = "../mperf-data" }
pmu-data = { package = "miniperf-pmu-data", path = "../pmu-data" }
serde_json = "1.0"

[[bin]]
name = "mperf-gui"
path = "src/main.rs"
test = false

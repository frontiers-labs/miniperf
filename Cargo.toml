[workspace]
resolver = "2"
members = [
    "collector-core",
    "libprof",
    "mperf",
    "mperf-data",
    "mperf-trace",
    "mperf-gui",
    "pmu-data",
    "shims",
    "shims/libc",
    "shims/itt",
    "shims/ompt",
    "shims/mpi",
    "shims/cupti",
    "shmem",
    "store",
    "symbolize",
    "truth",
    "utils/event-import",
    "utils/qemu-roofline",
    "utils/roofline-core",
    "xtask",
]

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
mperf.opt-level = 3

# roofline-core sits on the instrumentation hot path (billions of calls per
# profiled run); a single codegen unit lets the batch loop inline the cache
# model and CFG accounting across modules.
[profile.release.package.miniperf-roofline-core]
codegen-units = 1

# `libduckdb-sys` is vendored only to give it a build-dependency on
# `miniperf-duckdb-prefetch`, which installs the pinned DuckDB before rustc
# compiles this crate. Nothing else differs from the published crate; re-vendor
# it when the `duckdb` pin moves.
[patch.crates-io]
libduckdb-sys = { path = "third_party/libduckdb-sys" }

name: Postcommit

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: postcommit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  gui:
    needs: [ci]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/gui.yml

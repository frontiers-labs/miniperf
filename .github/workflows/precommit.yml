name: Precommit

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: precommit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Needs the workflow, not a job inside it, so the GUI pipeline is downstream
  # of every recording without any stage depending on itself. `!cancelled()`
  # keeps GUI coverage alive when a hardware flake reddens the test stage.
  # Needs the workflow, not a job inside it, so no stage depends on itself.
  # Gated on the packages existing rather than on CI passing, so a red test
  # stage does not suppress GUI coverage but a failed build does not queue a
  # job with nothing to download.
  gui:
    needs: [ci]
    if: ${{ !cancelled() && needs.ci.outputs.packaged == 'true' }}
    uses: ./.github/workflows/gui.yml

name: Reusable CI

# Cheap checks gate expensive ones: formatting and a workspace `cargo check`
# must pass before any platform builds or tests start, and everything must
# pass before packaging runs.

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag that receives the packages; empty for CI artifacts only
        required: false
        default: ''
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  quick:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: fmt
            command: cargo fmt --all -- --check
          - task: check
            command: cargo check --workspace --all-targets
          # A hand-edited or half-published manifest would only surface at
          # packaging time, on one platform, hours later.
          - task: deps-manifest
            command: python3 utils/deps/manifest.py check
          # Platform breakage is otherwise found by a different CI leg, hours
          # later; this makes it a red build on every target in seconds.
          - task: platform-cfg
            command: python3 utils/platform-cfg-guard.py
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust
        with:
          target: x86_64-unknown-linux-gnu
          components: clippy, rustfmt
          cache-key: quick-${{ matrix.task }}
      - run: ${{ matrix.command }}

  verify:
    name: ${{ matrix.task }} (${{ matrix.platform }})
    needs: quick
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            task: build
            command: cargo build --workspace --all-targets
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            task: test
            command: sudo sysctl -w kernel.perf_event_paranoid=-1 && cargo test --workspace --all-targets
          # Event tables are compiled in per host architecture, so a test that
          # asserts an invariant across every shipped table sees only the
          # runner's own tables and passes without checking anything. The
          # sampling-group invariants are exactly that kind of test, and the
          # RISC-V tables are where they last broke.
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            task: test-event-tables
            command: cargo test -p libprof --lib --features events-x86-64,events-aarch64,events-riscv64
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            task: clippy
            command: cargo clippy --workspace --all-targets -- -D warnings
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            task: libprof-features
            command: cargo check -p libprof --no-default-features && cargo clippy -p libprof --all-features --all-targets -- -D warnings
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            task: libprof-docs
            command: RUSTDOCFLAGS="-D warnings" cargo doc -p libprof -p miniperf-pmu-data --all-features --no-deps
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            task: clippy
            command: cargo clippy --workspace --all-targets -- -D warnings
          - platform: linux-riscv64
            runner: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
            task: build
            command: cargo build -p mperf -p miniperf-collector-core -p miniperf-shim-libc --target riscv64gc-unknown-linux-gnu
          - platform: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            task: build
            command: cargo build --workspace --all-targets
          - platform: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            task: test
            command: MPERF_NO_PMU=1 cargo test --workspace --all-targets
          - platform: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            task: clippy
            command: cargo clippy --workspace --all-targets -- -D warnings
          # Windows ships the GUI only, so it builds the viewer and what it
          # needs rather than the whole workspace.
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            task: build
            command: cargo build -p mperf-gui -p miniperf-store
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            task: clippy
            command: cargo clippy -p mperf-gui -p miniperf-store --all-targets -- -D warnings
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust
        with:
          target: ${{ matrix.target }}
          components: clippy, rustfmt
          cache-key: verify-${{ matrix.platform }}-${{ matrix.task }}
      - name: Run ${{ matrix.task }}
        env:
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
        run: ${{ matrix.command }}

  package:
    name: Package (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: linux-riscv64
            runner: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
          - platform: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust
        with:
          target: ${{ matrix.target }}
          cache-key: package-${{ matrix.target }}
      - name: Build package
        env:
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
        run: utils/package-miniperf.sh "${{ matrix.target }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: miniperf-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
      - name: Attach package to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/* --clobber

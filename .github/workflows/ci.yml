name: Reusable CI

# Three stages. Cheap source checks gate the builds; the builds produce the
# release packages; the tests run those packages on hardware and publish the
# recordings they made. No stage compiles anything the next one needs beyond
# its artifacts, and no job depends on another job in its own stage.
#
# Nothing here names a check or a runner label: both matrices come from
# `cargo xtask matrix`, so the workflow cannot drift from xtask/src/registry.rs.

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag that receives the packages; empty for CI artifacts only
        required: false
        default: ''
        type: string
    outputs:
      gui_matrix:
        description: Runner matrix for the GUI pipeline
        value: ${{ jobs.lint.outputs.gui }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.matrix.outputs.package }}
      test: ${{ steps.matrix.outputs.test }}
      gui: ${{ steps.matrix.outputs.gui }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust
        with:
          target: x86_64-unknown-linux-gnu
          components: clippy, rustfmt
          cache-key: lint-x86_64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: cargo xtask check lint
      - id: matrix
        run: |
          {
            echo "package=$(cargo xtask matrix package)"
            echo "test=$(cargo xtask matrix test)"
            echo "gui=$(cargo xtask matrix gui)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: lint
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.lint.outputs.package) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust
        with:
          target: ${{ matrix.target }}
          cache-key: package-${{ matrix.target }}
      - name: Build the package
        env:
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
        run: utils/package-miniperf.sh "${{ matrix.target }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: miniperf-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
      - name: Attach package to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/* --clobber

  test:
    name: test (${{ matrix.label }})
    needs: [lint, build]
    runs-on: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.lint.outputs.test) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: miniperf-${{ matrix.platform }}
          path: dist
      - name: Unpack
        id: unpack
        run: |
          mkdir -p pkg
          tar -C pkg -xf dist/*.tar.* 
          root="$(find pkg -maxdepth 1 -mindepth 1 -type d | head -1)"
          echo "root=$(cd "$root" && pwd)" >> "$GITHUB_OUTPUT"
      - name: Install check dependencies
        if: join(matrix.apt, ' ') != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ join(matrix.apt, ' ') }}
      - name: Allow perf
        if: matrix.os == 'linux'
        run: sudo sysctl -w kernel.perf_event_paranoid=-1
      - name: Run checks
        id: checks
        env:
          MPERF_PACKAGE: ${{ steps.unpack.outputs.root }}
          CHECK_WORK: ${{ github.workspace }}/check-work
        run: checks/run ${{ join(matrix.checks, ' ') }}
      - name: Publish the recordings these checks made
        if: matrix.records && always()
        uses: actions/upload-artifact@v4
        with:
          name: recordings-${{ matrix.label }}
          path: check-work/rec-*
          if-no-files-found: ignore

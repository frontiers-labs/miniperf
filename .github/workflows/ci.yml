name: Reusable CI

# Three stages. Cheap source checks gate the builds; the builds produce the
# release packages; the tests run those packages on hardware and publish the
# recordings they made. No stage compiles anything the next one needs beyond
# its artifacts, and no job depends on another job in its own stage.
#
# The matrices below are plain GitHub config, because that is all they are.
# Which checks apply to a runner is decided by the checks themselves when they
# run: a check that needs a PMU or a Linux host says so and exits 3 there.

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag that receives the packages; empty for CI artifacts only
        required: false
        default: ''
        type: string
    outputs:
      packaged:
        description: Whether every package was built, so downstream pipelines have artifacts
        value: ${{ jobs.build.result == 'success' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust
        with:
          target: x86_64-unknown-linux-gnu
          components: clippy, rustfmt
          cache-key: lint-x86_64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: cargo xtask check lint

  build:
    name: build (${{ matrix.platform }})
    needs: lint
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64,   target: x86_64-unknown-linux-gnu,     runner: ubuntu-24.04 }
          - { platform: linux-aarch64,  target: aarch64-unknown-linux-gnu,    runner: ubuntu-24.04-arm }
          - { platform: linux-riscv64,  target: riscv64gc-unknown-linux-gnu,  runner: ubuntu-24.04 }
          - { platform: macos-aarch64,  target: aarch64-apple-darwin,         runner: macos-14 }
          - { platform: windows-x86_64, target: x86_64-pc-windows-msvc,       runner: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust
        with:
          target: ${{ matrix.target }}
          cache-key: package-${{ matrix.target }}
      - name: Build the package
        env:
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
        run: utils/package-miniperf.sh "${{ matrix.target }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: miniperf-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
      - name: Attach package to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/* --clobber

  test:
    name: test (${{ matrix.label }})
    needs: [lint, build]
    timeout-minutes: 15
    runs-on: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 x86 has no PMU, so its hardware checks skip themselves
          # and it covers the CLI and package surface. ubuntu-24.04-arm is free
          # and has 7 counters, so it is the reference PMU runner. The single
          # Blacksmith job is the only paid one, and exists because x86 event
          # tables are compiled per architecture.
          - { label: ubuntu-24.04,                 platform: linux-x86_64,   os: linux }
          - { label: ubuntu-24.04-arm,             platform: linux-aarch64,  os: linux }
          - { label: blacksmith-2vcpu-ubuntu-2404, platform: linux-x86_64,   os: linux }
          - { label: macos-14,                     platform: macos-aarch64,  os: macos }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: miniperf-${{ matrix.platform }}
          path: dist
      - name: Unpack
        id: unpack
        run: echo "root=$(utils/unpack-package.sh dist pkg)" >> "$GITHUB_OUTPUT"
      # The OMPT and MPI shims are only observable through a runtime that
      # implements them: libgomp has no OMPT interface, so without clang and
      # libomp those checks would skip on every run forever, which is no
      # better than not having them.
      # Only on the free reference runner: neither shim is architecture
      # specific, so covering them once is enough, and apt on the paid runner
      # is time nobody is buying anything with.
      - name: Install the runtimes the shim checks need
        if: matrix.label == 'ubuntu-24.04-arm'
        run: sudo apt-get update && sudo apt-get install -y clang libomp-dev mpich

      - name: Allow perf
        if: matrix.os == 'linux'
        run: sudo sysctl -w kernel.perf_event_paranoid=-1
      - name: Run checks
        id: checks
        env:
          MPERF_PACKAGE: ${{ steps.unpack.outputs.root }}
          CHECK_WORK: ${{ github.workspace }}/check-work
        run: checks/run
      - name: Publish the recordings these checks made
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recordings-${{ matrix.label }}
          path: check-work/rec-*
          if-no-files-found: ignore

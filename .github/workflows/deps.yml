name: Dependencies

# Builds the external binaries miniperf links or ships — DuckDB, DynamoRIO and
# qemu-user — for every platform that supports them, publishes them as a dated
# prerelease, and opens a pull request repinning deps/manifest.toml.
#
# Nothing in the main CI gate builds these any more: it downloads the pinned
# release instead.

on:
  workflow_dispatch:
    inputs:
      refresh_upstream:
        description: Resolve the newest DynamoRIO commit and QEMU release instead of using the pinned versions
        type: boolean
        default: false
      open_pull_request:
        description: Open a pull request repinning deps/manifest.toml
        type: boolean
        default: true
  # Editing a patch changes what the bundle contains, and the pinned artifact
  # stays stale until something rebuilds it. Publishing from a pull request is
  # not safe, so this only validates that the patches still apply; rerun the
  # workflow by hand to publish a bundle carrying them.
  pull_request:
    paths:
      - deps/patches/**
      - utils/build-dynamorio-bundle.sh
  schedule:
    # Monthly, on the 1st.
    - cron: '0 3 1 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deps
  cancel-in-progress: false

jobs:
  patches:
    name: DynamoRIO patches apply
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check every patch applies to the pinned revision
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(deps/patches/dynamorio/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no DynamoRIO patches to check"
            exit 0
          fi
          repository="$(python3 utils/deps/manifest.py get upstream.dynamorio.repository)"
          revision="$(python3 utils/deps/manifest.py get upstream.dynamorio.revision)"
          git init --quiet source
          git -C source remote add origin "${repository}"
          git -C source fetch --quiet --depth 1 origin "${revision}"
          git -C source checkout --quiet FETCH_HEAD
          for patch in "${patches[@]}"; do
            printf 'checking %s\n' "$(basename "${patch}")"
            git -C source apply --check "../${patch}"
            git -C source apply "../${patch}"
          done
          echo "all patches apply to ${revision}"

  plan:
    name: Resolve versions
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      duckdb_version: ${{ steps.resolve.outputs.duckdb_version }}
      dynamorio_revision: ${{ steps.resolve.outputs.dynamorio_revision }}
      qemu_version: ${{ steps.resolve.outputs.qemu_version }}
      qemu_sha256: ${{ steps.resolve.outputs.qemu_sha256 }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH: ${{ inputs.refresh_upstream || github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          get() { python3 utils/deps/manifest.py get "$1"; }

          # DuckDB is deliberately not auto-bumped: miniperf-store links the
          # prebuilt library against the `duckdb` crate's pregenerated
          # bindings, so the two must move together in a reviewed change.
          duckdb_version="$(get upstream.duckdb.version)"
          dynamorio_revision="$(get upstream.dynamorio.revision)"
          qemu_version="$(get upstream.qemu.version)"
          qemu_sha256="$(get upstream.qemu.source_sha256)"

          if [[ "${REFRESH}" == true ]]; then
            dynamorio_revision="$(gh api repos/DynamoRIO/dynamorio/commits/master --jq .sha)"
            qemu_version="$(
              curl --fail --silent --show-error https://download.qemu.org/ |
                grep -oE 'qemu-[0-9]+\.[0-9]+\.[0-9]+\.tar\.xz' |
                sed -e 's/^qemu-//' -e 's/\.tar\.xz$//' |
                sort --version-sort |
                tail -n 1
            )"
            curl --fail --location --retry 3 --silent --show-error \
              "https://download.qemu.org/qemu-${qemu_version}.tar.xz" --output qemu.tar.xz
            qemu_sha256="$(sha256sum qemu.tar.xz | awk '{ print $1 }')"
            rm -f qemu.tar.xz
          fi

          {
            printf 'release_tag=deps-%s\n' "$(date -u +'%Y.%m.%d')"
            printf 'duckdb_version=%s\n' "${duckdb_version}"
            printf 'dynamorio_revision=%s\n' "${dynamorio_revision}"
            printf 'qemu_version=%s\n' "${qemu_version}"
            printf 'qemu_sha256=%s\n' "${qemu_sha256}"
          } | tee -a "${GITHUB_OUTPUT}"

      # deps/manifest.toml's [support] table drives both the build matrix and
      # the completeness gate in `publish`, so the two cannot disagree.
      - id: matrix
        run: printf 'matrix=%s\n' "$(python3 utils/deps/manifest.py matrix)" >>"${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.dependency }} (${{ matrix.platform }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      DUCKDB_VERSION: ${{ needs.plan.outputs.duckdb_version }}
      DYNAMORIO_REVISION: ${{ needs.plan.outputs.dynamorio_revision }}
      # Not QEMU_VERSION/QEMU_SHA256: qemu-user parses QEMU_* environment
      # variables as its own options, and QEMU_VERSION makes every qemu
      # invocation print its version and exit.
      MINIPERF_QEMU_VERSION: ${{ needs.plan.outputs.qemu_version }}
      MINIPERF_QEMU_SHA256: ${{ needs.plan.outputs.qemu_sha256 }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build zstd

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install --quiet ninja zstd

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Assemble the riscv64 sysroot
        if: matrix.cross == 'riscv64'
        run: utils/deps/setup-riscv64-sysroot.sh

      - name: Install DynamoRIO build dependencies
        if: matrix.dependency == 'dynamorio' && matrix.cross != 'riscv64'
        run: sudo apt-get install -y zlib1g-dev

      - name: Install QEMU build dependencies
        if: matrix.dependency == 'qemu'
        run: |
          sudo apt-get install -y \
            curl \
            gcc-riscv64-linux-gnu \
            libglib2.0-dev \
            pkg-config \
            python3 \
            python3-venv \
            xz-utils
          if [[ "${{ matrix.cross }}" != riscv64 ]]; then
            sudo apt-get install -y libcapstone-dev
          fi
          if [[ "${{ matrix.platform }}" == linux-aarch64 ]]; then
            sudo apt-get install -y gcc-x86-64-linux-gnu
          fi

      - name: Install Rust toolchain
        if: matrix.dependency != 'duckdb'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cross == 'riscv64' && 'riscv64gc-unknown-linux-gnu' || '' }}

      - name: Build ${{ matrix.dependency }}
        run: |
          case "${{ matrix.dependency }}" in
            duckdb) utils/build-duckdb-bundle.sh "${{ matrix.platform }}" dist ;;
            dynamorio) utils/build-dynamorio-bundle.sh "${{ matrix.platform }}" dist ;;
            qemu) utils/build-qemu-user-bundle.sh "${{ matrix.platform }}" dist ;;
          esac

      # `build-dynamorio-bundle.sh` fails when a patch stops applying, but an
      # empty or mislaid patch directory would quietly produce a stock upstream
      # build that behaves like the one this repo cannot use on RISC-V. Assert
      # the bundle records every patch that was meant to go into it.
      - name: Verify the DynamoRIO bundle is patched
        if: matrix.dependency == 'dynamorio'
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected=(deps/patches/dynamorio/*.patch)
          if [ ${#expected[@]} -eq 0 ]; then
            echo "no DynamoRIO patches in this checkout; nothing to verify"
            exit 0
          fi
          archive=(dist/miniperf-dynamorio-*.tar.zst)
          manifest="$(tar --extract --zstd --to-stdout --file "${archive[0]}" \
            --wildcards '*/MANIFEST.txt')"
          printf '%s\n' "${manifest}"
          for patch in "${expected[@]}"; do
            name="$(basename "${patch}")"
            grep -qxF "patch=${name}" <<<"${manifest}" || {
              echo "bundle does not record ${name}" >&2
              exit 1
            }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dep-${{ matrix.dependency }}-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.plan.outputs.release_tag }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dep-*
          merge-multiple: true

      # A partial dependency release is what let a 4-of-11 run publish itself
      # and open a repin pull request. Fail before anything is written.
      - name: Require every supported platform
        run: |
          set -euo pipefail
          python3 utils/deps/manifest.py check --artifacts dist | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Regenerate deps/manifest.toml
        run: |
          set -euo pipefail
          python3 utils/deps/manifest.py write \
            --release "${{ needs.plan.outputs.release_tag }}" \
            --artifacts dist \
            --set "upstream.duckdb.version=${{ needs.plan.outputs.duckdb_version }}" \
            --set "upstream.dynamorio.revision=${{ needs.plan.outputs.dynamorio_revision }}" \
            --set "upstream.qemu.version=${{ needs.plan.outputs.qemu_version }}" \
            --set "upstream.qemu.source_sha256=${{ needs.plan.outputs.qemu_sha256 }}" \
            --output deps/manifest.toml

      - name: Summarise the release
        run: |
          set -euo pipefail
          {
            printf '# External dependencies %s\n\n' "${{ needs.plan.outputs.release_tag }}"
            printf '| dependency | version |\n| --- | --- |\n'
            printf '| DuckDB | %s |\n' "${{ needs.plan.outputs.duckdb_version }}"
            printf '| DynamoRIO | %s |\n' "${{ needs.plan.outputs.dynamorio_revision }}"
            printf '| qemu-user | %s |\n' "${{ needs.plan.outputs.qemu_version }}"
            # The DynamoRIO bundle is the pinned revision plus these patches, so
            # a reviewer reading only the revision would have the wrong idea of
            # what shipped.
            shopt -s nullglob
            patches=(deps/patches/dynamorio/*.patch)
            if [ ${#patches[@]} -gt 0 ]; then
              printf '\nDynamoRIO patches applied on top of the pinned revision:\n\n'
              for patch in "${patches[@]}"; do
                printf -- '- `%s`\n' "$(basename "${patch}")"
              done
            fi
          } >summary.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.zst dist/*.zip dist/*.sha256)
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --prerelease \
              --title "External dependencies ${RELEASE_TAG}" \
              --notes-file summary.md
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber

      - name: Open the repin pull request
        if: github.event_name == 'schedule' || inputs.open_pull_request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: deps/${{ needs.plan.outputs.release_tag }}
          title: 'ci: repin external dependencies on ${{ needs.plan.outputs.release_tag }}'
          commit-message: 'ci: repin external dependencies on ${{ needs.plan.outputs.release_tag }}'
          body-path: summary.md
          add-paths: deps/manifest.toml
          delete-branch: true

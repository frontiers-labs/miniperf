name: Rust toolchain
description: Installs the platform build dependencies, the Rust toolchain and the shared cargo cache.

inputs:
  target:
    description: Rust target triple
    required: true
  components:
    description: Comma-separated rustup components
    required: false
    default: ''
  cache-key:
    description: >-
      Cache identity. Jobs that compile the same artifacts for the same target
      must pass the same value so they share one cache entry; see ci.yml.
    required: false
    default: ''
  cache:
    description: Set to 'false' for jobs that compile nothing, so they neither restore nor store a cargo cache.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install GPUI Linux dependencies
      if: runner.os == 'Linux' && inputs.target != 'riscv64gc-unknown-linux-gnu'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

    - name: Install RISC-V cross compiler
      if: inputs.target == 'riscv64gc-unknown-linux-gnu'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.target }}

    # `shared-key`, not `key`: rust-cache mixes the job id into `key`, so jobs
    # passing the same `key` still get separate entries. `shared-key` replaces
    # that job component, which is what lets build and test reuse one entry.
    - uses: Swatinem/rust-cache@v2
      if: inputs.cache != 'false'
      with:
        shared-key: ${{ inputs.cache-key }}

    # Must precede cargo: rustc bundles DuckDB's static archive into the
    # libduckdb-sys rlib as it compiles it, long before any build script of
    # ours could fetch it.
    - name: Install the pinned DuckDB
      if: inputs.cache != 'false'
      shell: bash
      run: utils/deps/setup-duckdb.sh "${{ inputs.target }}"

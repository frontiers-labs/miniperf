[package]
name = "miniperf-store"
version = "0.1.0"
edition = "2024"

[lib]
name = "store"

[dependencies]
anyhow = "1.0"
# Pinned to the arrow major the `duckdb` crate depends on; a mismatch compiles
# a second copy of every arrow crate. The writer only ever emits ZSTD, so the
# other parquet codecs are off.
arrow = { version = "58", default-features = false }
parquet = { version = "58", default-features = false, features = ["arrow", "zstd"] }
duckdb = { version = "1.10505.0", features = ["parquet"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
libc = "0.2"

[features]
default = ["session"]
session = ["dep:duckdb"]

[dev-dependencies]
tempfile = "3"

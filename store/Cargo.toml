# Coverage comes from checks/, which drives the packaged binaries on real
# recordings. See checks/lint/test-policy.
[package]
name = "miniperf-store"
version = "0.2.0"
edition = "2024"

[lib]
test = false
doctest = false
name = "store"

[dependencies]
anyhow = "1.0"
miniperf-store-writer = { path = "writer" }
duckdb = { version = "1.10505.0", optional = true }
mperf-data = { path = "../mperf-data", optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = ["session"]
session = ["dep:duckdb", "dep:mperf-data", "dep:serde_json"]

[dev-dependencies]
tempfile = "3"
